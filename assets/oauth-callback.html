<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth認証完了 - Raku Raku Notion</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      background-color: #000;
      color: white;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    /* Star Rail Style Overlay */
    .raku-overlay {
      display: none; /* Initially hidden */
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2147483647;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
    }
    
    .raku-modal {
      position: relative;
      width: 900px;
      max-width: 90%;
      min-height: 500px;
      background: radial-gradient(circle at center, #1a1a2e 0%, #000000 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
      color: white;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .raku-header {
      padding: 30px 0 10px 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .raku-icon {
      font-size: 30px;
      margin-bottom: 5px;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
    }

    .raku-title {
      font-size: 24px;
      margin: 5px 0 0 0;
      color: #fff;
      font-weight: 500;
      letter-spacing: 2px;
    }

    .raku-dec-line {
      width: 200px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
      margin-top: 10px;
    }

    .raku-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 60px;
      text-align: center;
    }

    .raku-img-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
    }

    .raku-corner {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: rgba(255,255,255,0.5);
      border-style: solid;
    }
    .tl { top: 0; left: 0; border-width: 1px 0 0 1px; }
    .tr { top: 0; right: 0; border-width: 1px 1px 0 0; }
    .bl { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
    .br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    .raku-img {
      max-width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 20px rgba(0, 255, 255, 0.2));
    }

    .raku-text {
      font-size: 16px;
      color: #d0d0d0;
      font-weight: 500;
      line-height: 1.6;
    }

    .raku-footer {
      padding: 0 0 40px 0;
      display: flex;
      justify-content: center;
    }

    .raku-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 12px 100px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-decoration: none;
      display: inline-block;
    }
    .raku-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
    }

    /* Original Spinner/Error Styles (Hidden or repurposed) */
    .spinner-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top: 4px solid #00ffff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-container {
      text-align: center;
      color: #ff4d4f;
      display: none;
    }
  </style>
</head>
<body>
  
  <!-- Loading Spinner -->
  <div class="spinner-container" id="spinner-view">
    <div class="spinner"></div>
    <div style="color: #ccc;">認証処理中...</div>
  </div>

  <!-- Error View -->
  <div class="error-container" id="error-view">
    <h1 style="font-size: 24px; margin-bottom: 10px;">認証エラー</h1>
    <p id="error-message"></p>
  </div>

  <!-- Success Overlay -->
  <div class="raku-overlay" id="success-overlay">
    <div class="raku-modal">
      <div class="raku-header">
        <div class="raku-icon">🔰</div>
        <h2 class="raku-title">認証が完了しました</h2>
        <div class="raku-dec-line"></div>
      </div>
      
      <div class="raku-content">
        <div class="raku-text">
          <div>拡張機能のボタンをもう一度押して、<br>Webページの保存を開始してください。</div>
        </div>
      </div>

      <div class="raku-footer">
        <button class="raku-btn" id="close-btn">閉じる</button>
      </div>
    </div>
  </div>

  <script src="oauth-callback.js"></script>
</body>
</html>
